name: Publish package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - '@lengi21/federation-contracts'
          - '@lengi21/t10go-design-system'
          - '@lengi21/t10go-env-loader'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@lengi21'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '${{ inputs.package }}' run build
      - name: Publish selected package
        run: |
          case '${{ inputs.package }}' in
            '@lengi21/t10go-design-system')
              npm publish dist/t10go-design-system --access restricted
              ;;
            '@lengi21/t10go-env-loader')
              npm publish dist/t10go-env-loader --access restricted
              ;;
            '@lengi21/federation-contracts')
              pnpm --filter '${{ inputs.package }}' publish --no-git-checks
              ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
