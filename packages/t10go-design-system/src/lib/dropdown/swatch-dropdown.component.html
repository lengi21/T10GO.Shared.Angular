<div class="t10go-swatch-dropdown">
  <span class="t10go-swatch-dropdown__label">{{ label() }}</span>
  <button
    type="button"
    class="t10go-swatch-dropdown__trigger"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    (click)="toggle()"
  >
    <span class="t10go-swatch-dropdown__swatches" aria-hidden="true">
      @for (color of selectedOption()?.colors ?? []; track color) {
        <span class="t10go-swatch-dropdown__swatch" [style.background-color]="color"></span>
      }
    </span>
    <span>{{ selectedOption()?.label ?? 'Select a palette' }}</span>
    <span class="t10go-swatch-dropdown__chevron" aria-hidden="true"></span>
  </button>

  @if (isOpen()) {
    <div class="t10go-swatch-dropdown__menu" role="listbox" [attr.aria-label]="label()">
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="t10go-swatch-dropdown__option"
          [class.t10go-swatch-dropdown__option--selected]="option.value === value()"
          [disabled]="option.disabled"
          role="option"
          [attr.aria-selected]="option.value === value()"
          (click)="select(option)"
        >
          <span class="t10go-swatch-dropdown__swatches" aria-hidden="true">
            @for (color of option.colors; track color) {
              <span class="t10go-swatch-dropdown__swatch" [style.background-color]="color"></span>
            }
          </span>
          <span class="t10go-swatch-dropdown__option-copy">
            <span>{{ option.label }}</span>
            @if (option.description) {
              <span class="t10go-swatch-dropdown__description">{{ option.description }}</span>
            }
          </span>
        </button>
      }
    </div>
  }
</div>
